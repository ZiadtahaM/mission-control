kind = "web"
previewPath = "/"
title = "SaaS Boilerplate"
version = "1.0.0"
id = "artifacts/saas-boilerplate"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21434

[services.development]
run = "pnpm --filter @workspace/saas-boilerplate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saas-boilerplate", "run", "build" ]
publicDir = "artifacts/saas-boilerplate/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21434"
BASE_PATH = "/"
